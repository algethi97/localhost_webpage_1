<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방명록</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>
  <!-- 상단 네비게이션 -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">✨</span>
        <span>NaJakHome</span>
      </a>
      <div class="nav-menu">
        <a href="/" class="nav-btn">홈</a>
        <a href="/guestbook" class="nav-btn active">방명록</a>
        <a href="/photo" class="nav-btn">사진첩</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- 헤더 & 홈으로 이동 버튼 -->
    <header class="page-header">
      <div>
        <h1 class="page-title">💬 방명록</h1>
        <p class="page-subtitle">인사 한마디나 하고싶은 말을 자유롭게 남겨주세요.</p>
      </div>
      <a href="/" class="btn-back">
        <span>&larr;</span>
        <span>홈으로 돌아가기</span>
      </a>
    </header>

    <!-- 글 작성 패널 -->
    <section class="panel">
      <h2 class="panel-title">✍️ 새 글 남기기</h2>
      <form id="guestbook-form">
        <div class="form-group">
          <label for="author-input" class="form-label">작성자 (닉네임)</label>
          <input 
            type="text" 
            id="author-input" 
            class="form-input" 
            placeholder="이름 또는 닉네임을 입력하세요 (기본값: 익명)" 
            maxlength="20"
          >
        </div>

        <div class="form-group">
          <label for="message-input" class="form-label">메시지 내용</label>
          <textarea 
            id="message-input" 
            class="form-textarea" 
            placeholder="남기실 메시지를 적어주세요... (Enter: 바로 전송, Shift+Enter: 줄바꿈)" 
            rows="3"
            required
          ></textarea>
          <div class="form-hint">
            <span>💡 <strong>Tip:</strong> [보내기] 버튼을 누르거나 <strong>Enter 키</strong>를 치면 바로 전송됩니다.</span>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span>🚀 보내기</span>
        </button>
      </form>
    </section>

    <!-- 방명록 목록 피드 -->
    <section>
      <div class="feed-header">
        <h2 class="feed-title">📜 남겨진 메시지</h2>
        <span id="entry-count" class="feed-count">0개의 글</span>
      </div>

      <div id="guestbook-list" class="guestbook-list">
        <!-- 등록된 글들이 여기에 표시됩니다 -->
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <p>아직 작성된 방명록이 없습니다. 첫 번째 발자취를 남겨보세요!</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Mini-Project. Built with FastAPI & ngrok.</p>
  </footer>

  <script src="/static/js/guestbook.js"></script>
</body>
</html>
